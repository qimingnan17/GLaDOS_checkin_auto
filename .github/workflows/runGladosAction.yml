name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 1点30分(北京时间 9点30分)
    - cron: 30 1 * * *
  watch:
    types: [started]

permissions:
  # 允许 GITHUB_TOKEN 在末尾 commit & push points_log.json
  contents: write

# 同一时刻只允许一个签到任务运行，避免并发提交导致 push 冲突
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3"
      # 历史积分记录直接由 checkout 恢复，无需 cache；末尾仍用 git commit 兜底
      - name: Run checkin
        run: |
          python3 glados.py
        env:
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          DEFAULT_CURRENT_POINTS: "281"
      # 兜底持久化：把积分记录提交回仓库，避免运行环境清理后数据丢失
      - name: Commit points log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add points_log.json
          git diff --cached --quiet || git commit -m "chore: update points log [skip ci]"
          # 先 rebase 远端可能的提交，避免非 fast-forward 导致 push 失败
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
